<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>MaqPlace</title>
<style>
  :root{
    --black:#111111;
    --gray-text:#6b7280;
    --gray-light:#9ca3af;
    --border:#e5e7eb;
    --card-header-bg:#e9e9e9;
    --orange:#f5a623;
  }
  *{margin:0;padding:0;box-sizing:border-box;font-family:-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;}
  html,body{background:#fff;color:var(--black);}
  .frame-bar{height:8px;background:#000;width:100%;}

  /* ===== TOP NAV ===== */
  .navbar{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:14px 32px;
    border-bottom:1px solid #000;
  }
  .search{
    display:flex;
    align-items:center;
    gap:8px;
    border:1px solid #cfcfcf;
    border-radius:999px;
    padding:10px 18px;
    width:280px;
    color:var(--gray-light);
    font-size:14px;
  }
  .search svg{flex-shrink:0;width:15px;height:15px;stroke:var(--gray-light);}

  .nav-icons{display:flex;align-items:center;gap:34px;}
  .nav-item{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:4px;
    font-size:12px;
    color:var(--gray-text);
    cursor:default;
    user-select:none;
  }
  .nav-item svg{width:20px;height:20px;}
  .nav-item.active{color:var(--black);font-weight:600;}
  .nav-item.active svg{stroke:var(--black);fill:var(--black);}
  .nav-item:not(.active) svg{stroke:var(--gray-text);fill:none;}
  .nav-item.user{flex-direction:row;gap:4px;align-items:center;}
  .nav-item.user .chev{width:10px;height:10px;margin-top:2px;}

  /* ===== MAIN LAYOUT ===== */
  .main{
    display:flex;
    gap:40px;
    padding:32px;
    align-items:flex-start;
  }

  /* profile card */
  .profile-card{
    width:200px;
    border:1px solid var(--border);
    border-radius:10px;
    overflow:hidden;
    flex-shrink:0;
  }
  .profile-card .header{
    background:var(--card-header-bg);
    height:70px;
    position:relative;
  }
  .profile-card .avatar{
    width:60px;
    height:60px;
    border-radius:50%;
    background:#dcdde0;
    border:3px solid #fff;
    position:absolute;
    left:16px;
    top:38px;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .profile-card .avatar svg{width:30px;height:30px;fill:#9298a0;}
  .profile-card .body{
    padding:36px 16px 18px;
  }
  .profile-card .body h3{font-size:17px;font-weight:600;margin-bottom:4px;}
  .profile-card .body p{font-size:12px;color:var(--gray-text);}

  /* recommendations */
  .recommend{flex:1;}
  .recommend h2{font-size:20px;font-weight:600;margin-bottom:18px;}
  .filters{display:flex;gap:10px;margin-bottom:60px;flex-wrap:wrap;}
  .pill{
    padding:9px 18px;
    border-radius:999px;
    font-size:13px;
    border:1px solid #d6d6d6;
    color:var(--black);
    background:#fff;
    cursor:default;
    user-select:none;
  }
  .pill.active{background:#000;color:#fff;border-color:#000;}

  .listing{
    display:flex;
    align-items:center;
    gap:14px;
  }
  .listing .icon{
    width:60px;
    height:60px;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .listing .icon svg{width:55px;height:55px;}
  .listing .brand .name{
    font-family:Arial, sans-serif;
    font-weight:800;
    font-size:22px;
    letter-spacing:0.5px;
    color:var(--orange);
    line-height:1;
  }
  .listing .brand .sub{
    font-size:9px;
    letter-spacing:2px;
    color:#222;
    font-weight:600;
    margin-top:2px;
  }

  /* floating messages widget */
  .messages-widget{
    position:fixed;
    bottom:0;
    right:24px;
    background:#fff;
    border:1px solid var(--border);
    border-bottom:none;
    border-radius:8px 8px 0 0;
    box-shadow:0 -2px 8px rgba(0,0,0,0.06);
    padding:12px 18px;
    display:flex;
    align-items:center;
    gap:10px;
    min-width:220px;
  }
  .messages-widget .avatar{
    width:30px;height:30px;border-radius:50%;
    background:#dcdde0;
    display:flex;align-items:center;justify-content:center;
  }
  .messages-widget .avatar svg{width:16px;height:16px;fill:#9298a0;}
  .messages-widget span{font-size:14px;font-weight:500;flex:1;}
  .messages-widget .chev{width:12px;height:12px;stroke:var(--gray-light);}

  .frame-bar.bottom{position:fixed;bottom:0;left:0;}
</style>
</head>
<body>

<div class="frame-bar"></div>

<!-- NAVBAR -->
<div class="navbar">
  <div class="search">
    <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
    Buscar
  </div>

  <div class="nav-icons">
    <div class="nav-item active">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 3l9 8h-3v9h-5v-6H11v6H6v-9H3z"/></svg>
      Início
    </div>
    <div class="nav-item">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="7" width="18" height="13" rx="2"/><path d="M8 7V5a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
      Vagas
    </div>
    <div class="nav-item">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 11.5a8.38 8.38 0 0 1-1.9 5.4 8.5 8.5 0 0 1-9.6 2.7L3 21l1.5-6.5A8.38 8.38 0 0 1 3 11.5 8.5 8.5 0 1 1 21 11.5z"/></svg>
      Mensagens
    </div>
    <div class="nav-item">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 3h12l3 5-9 13L3 8z"/><path d="M3 8h18M9 3l3 5 3-5M12 8l-3 13M12 8l3 13"/></svg>
      Planos
    </div>
    <div class="nav-item user">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="12" cy="8" r="3.2"/><path d="M5 20c0-3.5 3-6 7-6s7 2.5 7 6"/></svg>
      Eu
      <svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="M6 9l6 6 6-6"/></svg>
    </div>
  </div>
</div>

<!-- MAIN -->
<div class="main">

  <div class="profile-card">
    <div class="header">
      <div class="avatar">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 3.5-7 8-7s8 3 8 7"/></svg>
      </div>
    </div>
    <div class="body">
      <h3>Eu</h3>
      <p>676.767 Seguidores</p>
    </div>
  </div>

  <div class="recommend">
    <h2>Recomendados para você</h2>
    <div class="filters">
      <div class="pill active">Todos</div>
      <div class="pill">Escavadeiras</div>
      <div class="pill">Rolos Compactadores</div>
      <div class="pill">Guindastes</div>
      <div class="pill">Tratores</div>
    </div>

    <div class="listing">
      <div class="icon">
        <svg viewBox="0 0 64 64">
          <g fill="#111">
            <path d="M32 4l3 5 5-2 1 5 5 1-2 5 5 3-5 3 2 5-5 1-1 5-5-2-3 5-3-5-5 2-1-5-5-1 2-5-5-3 5-3-2-5 5-1 1-5 5 2z"/>
            <circle cx="32" cy="32" r="13" fill="#fff"/>
          </g>
          <g fill="#111">
            <path d="M21 38c0-3 2-5 5-5h4l3-6h5l2 6h2c2 0 4 2 4 4v3H21z"/>
            <rect x="19" y="38" width="26" height="3"/>
            <circle cx="24" cy="41" r="2.5"/>
            <circle cx="40" cy="41" r="2.5"/>
          </g>
        </svg>
      </div>
      <div class="brand">
        <div class="name">MAQPLACE</div>
        <div class="sub">SERVIÇOS DE MAQUINÁRIO</div>
      </div>
    </div>
  </div>

</div>

<!-- FLOATING MESSAGES -->
<div class="messages-widget">
  <div class="avatar">
    <svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 3.5-7 8-7s8 3 8 7"/></svg>
  </div>
  <span>Mensagens</span>
  <svg class="chev" viewBox="0 0 24 24" fill="none" stroke-width="2"><path d="M18 15l-6-6-6 6"/></svg>
</div>

<div class="frame-bar bottom"></div>

</body>
</html>
