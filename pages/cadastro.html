<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Página de Cadastro</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #8e241c 0%, #f1a31c 100%);
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .login-card {
            background-color: white;
            padding: 40px;
            border-radius: 8px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.2);
            width: 100%;
            max-width: 400px;
            text-align: left;
        }

        h1 {
            font-size: 28px;
            color: #000;
            margin-bottom: 30px;
            font-weight: bold;
        }

        .input-group {
            margin-bottom: 15px;
        }

        input {
            width: 100%;
            padding: 12px 15px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 16px;
            color: #333;
            outline: none;
        }

        input:focus {
            border-color: #8e241c;
        }

        .forgot-link {
            display: block;
            text-align: right;
            font-size: 12px;
            color: #777;
            text-decoration: none;
            margin-top: 5px;
        }

        .forgot-link:hover {
            text-decoration: underline;
        }

        .btn-submit {
            width: 100%;
            padding: 14px;
            background-color: #c13127;
            color: white;
            border: none;
            border-radius: 25px;
            font-size: 18px;
            font-weight: 500;
            cursor: pointer;
            margin-top: 25px;
            transition: background 0.3s;
        }

        .btn-submit:hover {
            background-color: #a52820;
        }

        .divider {
            display: flex;
            align-items: center;
            text-align: center;
            margin: 25px 0;
            color: #999;
            font-size: 14px;
        }

        .divider::before, .divider::after {
            content: '';
            flex: 1;
            border-bottom: 1px solid #ddd;
        }

        .divider:not(:empty)::before {
            margin-right: .5em;
        }

        .divider:not(:empty)::after {
            margin-left: .5em;
        }

        .btn-google {
            width: 100%;
            padding: 10px;
            background-color: white;
            color: #555;
            border: 1px solid #555;
            border-radius: 25px;
            font-size: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            cursor: pointer;
            transition: background 0.2s;
        }

        .btn-google:hover {
            background-color: #f9f9f9;
        }

        .btn-google img {
            width: 18px;
            height: 18px;
        }

        .signup-footer {
            margin-top: 20px;
            color: #000;
            font-size: 14px;
        }

        .signup-footer a {
            color: #c13127;
            text-decoration: none;
            font-weight: bold;
        }

        .signup-footer a:hover {
            text-decoration: underline;
        }

        .user-type-container {
            display: flex;
            justify-content: space-between;
            gap: 10px;
            margin-bottom: 20px;
        }

        .btn-type {
            flex: 1;
            padding: 8px;
            border: 1px solid #333;
            border-radius: 20px;
            background-color: #e0e0e0;
            cursor: pointer;
            font-size: 14px;
            transition: 0.3s;
        }

        .btn-type:hover {
            background-color: #ccc;
        }

        .login-link-inline {
            display: block;
            text-align: right;
            font-size: 11px;
            color: #777;
            text-decoration: none;
            margin-bottom: 10px;
        }
    </style>
</head>
<body>
    <div class="login-card">
        <h1>Cadastro</h1>
        <form>
            <div class="input-group">
                <input type="text" placeholder="Nome de Usuário">
            </div>
            <div class="input-group">
                <input type="email" placeholder="Email">
            </div>
            <div class="input-group">
                <input type="text" placeholder="CPF">
            </div>
            <div class="input-group">
                <input type="password" placeholder="Senha">
            </div>
            <a href="index.html" class="login-link-inline">Já possuo login</a>
            <div class="user-type-container">
                <button type="button" class="btn-type">Locador</button>
                <button type="button" class="btn-type">Locatário</button>
            </div>
            <button type="submit" class="btn-submit">Criar</button>
        </form>
        <div class="divider">ou</div>
        <button class="btn-google">
            <img src="https://www.google.com/favicon.ico" alt="Google">
            Continuar com Google
        </button>
    </div>
</body>
</html>
