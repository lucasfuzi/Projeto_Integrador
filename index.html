<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Projeto Integrador</title>
    <style>
        /* Reset básico para evitar margens indesejadas */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            /* Gradiente linear baseado nas cores da imagem */
            background: linear-gradient(135deg, #8e241c 0%, #f1a31c 100%);
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        /* Contentor principal (Card Branco) */
        .login-card {
            background-color: white;
            padding: 40px;
            border-radius: 8px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.2);
            width: 100%;
            max-width: 400px;
            text-align: left;
        }

        h1 {
            font-size: 28px;
            color: #000;
            margin-bottom: 30px;
            font-weight: bold;
        }

        /* Estilização dos campos de entrada */
        .input-group {
            margin-bottom: 15px;
        }

        input {
            width: 100%;
            padding: 12px 15px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 16px;
            color: #333;
            outline: none;
        }

        input:focus {
            border-color: #8e241c;
        }

        /* Link "Esqueceu a senha?" */
        .forgot-link {
            display: block;
            text-align: right;
            font-size: 12px;
            color: #777;
            text-decoration: none;
            margin-top: 5px;
        }

        .forgot-link:hover {
            text-decoration: underline;
        }

        /* Botão Entrar Principal */
        .btn-submit {
            width: 100%;
            padding: 14px;
            background-color: #c13127; /* Cor avermelhada do botão */
            color: white;
            border: none;
            border-radius: 25px; /* Bordas bem arredondadas */
            font-size: 18px;
            font-weight: 500;
            cursor: pointer;
            margin-top: 25px;
            transition: background 0.3s;
        }

        .btn-submit:hover {
            background-color: #a52820;
        }

        /* Divisor "ou" */
        .divider {
            display: flex;
            align-items: center;
            text-align: center;
            margin: 25px 0;
            color: #999;
            font-size: 14px;
        }

        .divider::before, .divider::after {
            content: '';
            flex: 1;
            border-bottom: 1px solid #ddd;
        }

        .divider:not(:empty)::before {
            margin-right: .5em;
        }

        .divider:not(:empty)::after {
            margin-left: .5em;
        }

        /* Botão do Google */
        .btn-google {
            width: 100%;
            padding: 10px;
            background-color: white;
            color: #555;
            border: 1px solid #555;
            border-radius: 25px;
            font-size: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            cursor: pointer;
            transition: background 0.2s;
        }

        .btn-google:hover {
            background-color: #f9f9f9;
        }

        .btn-google img {
            width: 18px;
            height: 18px;
        }

        /* Texto de Rodapé (fora do card) */
        .signup-footer {
            margin-top: 20px;
            color: #000;
            font-size: 14px;
        }

        .signup-footer a {
            color: #c13127;
            text-decoration: none;
            font-weight: bold;
        }

        .signup-footer a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <main class="login-card">
        <h1>Entrar</h1>
        
        <form action="#">
            <div class="input-group">
                <input type="text" placeholder="Email ou CPF" required>
            </div>
            
            <div class="input-group">
                <input type="password" placeholder="Senha" required>
                <a href="#" class="forgot-link">Esqueceu a senha?</a>
            </div>

            <button type="submit" class="btn-submit">Entrar</button>
        </form>

        <div class="divider">ou</div>

        <button class="btn-google">
            <!-- Ícone do Google via URL externa para facilitar o teste -->
            <img src="https://upload.wikimedia.org/wikipedia/commons/5/53/Google_%22G%22_Logo.svg" alt="Google Logo">
            Continuar com Google
        </button>
    </main>

    <p class="signup-footer">
        Ainda não tem login? <a href="pages/cadastro.html">Cadastre-se agora</a>
    </p>

</body>
</html>
